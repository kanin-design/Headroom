name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Build and test
        # Tests that draw are skipped where the machine has no GPU.
        run: swift test
      - name: Build the example app
        run: swift build --package-path Examples/FolderMap
